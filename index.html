<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>24点穷举</title>
<style>
/* 基准：1rem = 16px；手机会自动缩放根字体大小 */
html {
    font-size: max(14px, min(18px, 2.6vw));
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
    height:100%;
    background:#000;
    color:#0f0;
    font-family:Consolas,monospace;
    font-size:1rem;
    overflow:hidden;
}
#top-notice{
    width:100%;
    height:2.25rem;
    line-height:2.25rem;
    text-align:center;
    background:#111;
    border-bottom:#222 solid 1px;
}
#screen{
    width:100%;
    height:calc(100% - 4.75rem);
    overflow:auto;
    white-space:pre-wrap;
    padding:0.5rem;
}
#input-bar{
    height:2.5rem;
    display:flex;
    align-items:center;
    padding:0 0.75rem;
    border-top:#222 solid 1px;
    background:#000;
}
.prompt{color:#0f0;margin-right:0.5rem;}
#inp{
    flex:1;
    background:transparent;
    border:none;
    color:#0f0;
    outline:none;
    font:inherit;
}
.answer-line{
    color:#ffdd00;
    font-weight:bold;
}
.step-line{
    color:#66ccff;
}
</style>
</head>
<body>
<div id="top-notice">待命</div>
<div id="screen"></div>
<div id="input-bar">
    <span class="prompt">>></span>
    <input id="inp" autofocus>
</div>

<script>
const topNotice = document.getElementById("top-notice");
const screen = document.getElementById("screen");
const inp = document.getElementById("inp");

let stopFlag = false;
const delayMs = 6;
const stepDelay = 600;

function setNotice(text){
    topNotice.innerText = text;
}

function log(text, className=""){
    if(stopFlag && className==="") return;
    const span = document.createElement("span");
    if(className) span.className = className;
    span.innerText = text+"\n";
    screen.appendChild(span);
    screen.scrollTop = screen.scrollHeight;
}
function sleep(ms){
    return new Promise(res=>setTimeout(res,ms));
}

class Node{
    constructor(){
        this.left=null;
        this.right=null;
        this.op=null;
        this.value=null;
        this.isNum=false;
    }
    static num(v){
        let n=new Node();
        n.isNum=true;
        n.value=v;
        return n;
    }
    static bin(l,op,r){
        let n=new Node();
        n.left=l;n.op=op;n.right=r;
        return n;
    }
}

function tokenize(s){
    let tokens=[];
    let numBuf="";
    for(let ch of s){
        if("()+-×÷".includes(ch)){
            if(numBuf){tokens.push(parseFloat(numBuf));numBuf="";}
            tokens.push(ch);
        }else{
            numBuf+=ch;
        }
    }
    if(numBuf) tokens.push(parseFloat(numBuf));
    return tokens;
}

function parseExpr(str){
    const tokens=tokenize(str);
    let pos=0;
    function parse(){
        let stack=[];
        while(pos<tokens.length){
            let t=tokens[pos];
            if(t==='('){
                pos++;
                stack.push(parse());
            }else if(t===')'){
                pos++;
                break;
            }else if(typeof t==="number"){
                stack.push(Node.num(t));pos++;
            }else if(["+","-","×","÷"].includes(t)){
                let op=t;pos++;
                let right;
                if(tokens[pos]==='('){ pos++; right=parse(); }
                else { right=Node.num(tokens[pos]);pos++; }
                stack.push(Node.bin(stack.pop(),op,right));
            }
        }
        while(stack.length>1){
            let r=stack.pop(),op=stack.pop(),l=stack.pop();
            stack.push(Node.bin(l,op,r));
        }
        return stack[0];
    }
    return parse();
}

async function expand(node,steps){
    if(node.isNum) return node.value;
    const lv=await expand(node.left,steps);
    const rv=await expand(node.right,steps);
    let val;
    switch(node.op){
        case "+": val=lv+rv;break;
        case "-": val=lv-rv;break;
        case "×": val=lv*rv;break;
        case "÷": val=lv/rv;break;
    }
    const fmt=x=>Number.isInteger(x)?x:x.toFixed(2).replace(/\.00$/,"");
    let showOp = node.op;
    if(showOp === "-") showOp = "−";
    steps.push(`${fmt(lv)} ${showOp} ${fmt(rv)}  =  ${fmt(val)}`);
    return val;
}

async function getAutoSteps(exprText){
    const ast=parseExpr(exprText);
    const steps=[];
    await expand(ast,steps);
    return steps;
}

async function search(items){
    if(stopFlag) return;
    if(items.length === 1){
        const expr = items[0].expr;
        const val = items[0].value;
        await sleep(delayMs);
        if(stopFlag) return;
        if(Math.abs(val - 24) < 1e-9){
            let showExpr = expr.replaceAll("-","−");
            log(showExpr,"answer-line");
            stopFlag = true;
            setNotice("输出中");
            log("----演算步骤----","step-line");
            const steps = await getAutoSteps(expr);
            for(let s of steps){
                await sleep(stepDelay);
                log(s,"step-line");
            }
            setNotice("完成");
        }else{
            log(`计算:${expr} = ${val.toFixed(4)}`);
        }
        return;
    }

    for(let i=0;i<items.length;i++){
        for(let j=0;j<items.length;j++){
            if(i >= j) continue;
            if(stopFlag) return;
            const a = items[i];
            const b = items[j];
            const rest = [];
            for(let k=0;k<items.length;k++){
                if(k!==i && k!==j) rest.push(items[k]);
            }
            const ops = [
                {fn:(x,y)=>x+y, s:`(${a.expr}+${b.expr})`},
                {fn:(x,y)=>x-y, s:`(${a.expr}-${b.expr})`},
                {fn:(x,y)=>x*y, s:`(${a.expr}×${b.expr})`},
                {fn:(x,y)=>x/y, s:`(${a.expr}÷${b.expr})`}
            ];
            for(let op of ops){
                if(stopFlag) return;
                if(op.s.includes("÷") && Math.abs(b.value) < 1e-10) continue;
                const newVal = op.fn(a.value, b.value);
                const newItem = {value:newVal, expr:op.s};
                await search([...rest, newItem]);
            }
        }
    }
}

async function bootTip(){
    log("================================");
    log("使用说明：输入4个数字，数字之间空格隔开");
    log("输入完成按下回车键自动开始计算");
    log("示例：1 3 4 6");
    log("================================");
}

inp.onkeydown = async e=>{
    if(e.key !== 'Enter') return;
    e.preventDefault();
    const txt = inp.value.trim();
    screen.innerHTML = "";
    stopFlag = false;

    log(`>> ${txt}`);
    const ns = txt.split(/\s+/).map(Number).filter(n=>!isNaN(n));
    inp.value = "";
    if(ns.length!==4){
        log("错误：必须输入恰好4个数字");
        setNotice("待命");
        await bootTip();
        return;
    }
    setNotice("计算中");
    log("----------开始穷举----------");
    const init = ns.map(x=>({value:x, expr:String(x)}));
    await search(init);
    if(!stopFlag){
        log("========无解========");
        setNotice("完成");
    }
}

window.onload = async ()=>{
    setNotice("待命");
    await bootTip();
}
</script>
</body>
